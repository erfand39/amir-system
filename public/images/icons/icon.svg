<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="coneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for PWA -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)" />

  <!-- Outer Soundwaves Ring -->
  <circle cx="256" cy="226" r="160" fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="226" r="140" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-opacity="0.6" />
  
  <!-- Outer Speaker Rim -->
  <circle cx="256" cy="226" r="118" fill="none" stroke="url(#goldGradient)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Subwoofer Cone -->
  <circle cx="256" cy="226" r="110" fill="url(#coneGradient)" />
  <circle cx="256" cy="226" r="85" fill="#1e293b" stroke="#334155" stroke-width="3" />
  <circle cx="256" cy="226" r="55" fill="#0f172a" stroke="url(#goldGradient)" stroke-width="4" />
  
  <!-- Dust Cap -->
  <circle cx="256" cy="226" r="32" fill="url(#goldGradient)" filter="url(#glow)" />
  
  <!-- Sound Waves (Left & Right) -->
  <path d="M 96 226 A 160 160 0 0 1 120 160" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
  <path d="M 72 226 A 190 190 0 0 1 104 140" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  <path d="M 416 226 A 160 160 0 0 0 392 160" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" />
  <path d="M 440 226 A 190 190 0 0 0 408 140" fill="none" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Equalizer Bars -->
  <rect x="186" y="380" width="10" height="24" rx="5" fill="url(#goldGradient)" />
  <rect x="206" y="365" width="10" height="39" rx="5" fill="url(#goldGradient)" />
  <rect x="226" y="350" width="10" height="54" rx="5" fill="url(#goldGradient)" />
  <rect x="246" y="340" width="10" height="64" rx="5" fill="url(#goldGradient)" />
  <rect x="256" y="340" width="10" height="64" rx="5" fill="url(#goldGradient)" />
  <rect x="276" y="350" width="10" height="54" rx="5" fill="url(#goldGradient)" />
  <rect x="296" y="365" width="10" height="39" rx="5" fill="url(#goldGradient)" />
  <rect x="316" y="380" width="10" height="24" rx="5" fill="url(#goldGradient)" />

  <!-- Text: امیر سیستم -->
  <text x="256" y="450" font-family="Vazirmatn, Tahoma, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    امیر سیستم
  </text>
  <text x="256" y="475" font-family="sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="3">
    CAR AUDIO SPECIALIST
  </text>
</svg>
